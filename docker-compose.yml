services:
  db:
    image: mysql:8.0.44
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: amulet_market
      MYSQL_USER: amulet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u amulet -e 'SELECT 1' amulet_market",
        ]
      interval: 5s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes: ["images:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    restart: unless-stopped
  migrate:
    build: .
    user: node
    command: sh -c "npx prisma migrate deploy && npm run db:seed && node dist-server/scripts/init-storage.js"
    environment: &app_env
      NODE_ENV: ${NODE_ENV:-production}
      SERVE_STATIC: "true"
      DATABASE_URL: mysql://amulet:${MYSQL_PASSWORD}@db:3306/amulet_market
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: amulet-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
  app:
    build: .
    environment: *app_env
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      retries: 3
    restart: unless-stopped
volumes:
  mysql_data:
  images:
